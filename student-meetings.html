<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student – Book Appointment</title>
  <link rel="stylesheet" href="students-meetings.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>📅 Book an Appointment</h1>
    <p>Select an available time below. The system will assign you to a free counselor.</p>

    <div class="booking-interface">
        <div class="controls">
            <div class="form-group">
                <label for="appointment-date">Select Date</label>
                <input type="date" id="appointment-date">
            </div>
            <div class="form-group">
                <label for="counselor-filter">Filter by Counselor (Optional)</label>
                <select id="counselor-filter">
                    </select>
            </div>
        </div>

        <div id="unifiedSlotContainer" class="unified-slot-container">
            <div class="loading-message">Loading available slots...</div>
        </div>
    </div>
  </div>

  <div id="appointmentsSection">
      <h2>Your Appointments Schedule</h2>
      <button id="refreshAppointmentsBtn">Refresh Appointments</button>
      <div id="appointmentsContainer">
          <p>Loading appointments...</p>
      </div>
  </div>

  <div id="bookingModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <h2>Confirm Your Appointment</h2>
          <p>You are booking for <strong id="modal-time-date"></strong>.</p>
          <div class="form-group">
              <label for="modal-reason">Reason for Appointment</label>
              <textarea id="modal-reason" placeholder="Please provide a brief reason..."></textarea>
          </div>
          <div class="modal-actions">
              <button id="modal-confirm-btn">Confirm Booking</button>
              <button id="modal-cancel-btn">Cancel</button>
          </div>
      </div>
  </div>

  <script src="student-meetings.js"></script>
</body>
</html>
