<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        .notice {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .card {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            text-align: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .card img {
            width: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Homepage</h2>
        <div class="notice">
            <h3>Important Notice</h3>
            <p><strong>Keep Your IDM Password Fresh!</strong></p>
            <p>Activate your IDM to avoid disruptions in accessing applications.</p>
        </div>
        <div class="grid">
            <div class="card"><img src="icon.png" alt="Personal Information"><br>Personal Information</div>
            <div class="card"><img src="icon.png" alt="Campus Finances"><br>Campus Finances</div>
        </div>
    </div>
</body>
</html>
