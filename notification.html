<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f2ff;
            margin: 0;
            padding: 0;
        }
        .header {
            background: #0d47a1;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .notification-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 500px;
            margin-bottom: 15px;
        }
        .notification-box h3 {
            margin: 0 0 10px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
        }
        .approve {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .approve:hover {
            background-color: #388E3C;
        }
        .decline {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .decline:hover {
            background-color: #b71c1c;
        }
    </style>
    <script>
        function approveAppointment(studentName, date, time) {
            alert(studentName + "'s appointment has been approved.\nMeeting Scheduled on: " + date + " at " + time);
        }
        function declineAppointment(studentName) {
            alert(studentName + "'s appointment has been declined. The meeting will be rescheduled.");
        }
    </script>
</head>
<body>
    <div class="header">
        <h1>MMU</h1>
        <div class="nav">
            <a href="#">HOME</a>
            <a href="#">DASHBOARD</a>
            <a href="#" style="text-decoration: underline;">NOTIFICATION</a>
            <a href="#">APPOINTMENT</a>
        </div>
    </div>
    <div class="container">
        <h2>Appointment Requests</h2>
        <div class="notification-box">
            <h3>John Doe requested an appointment</h3>
            <p><strong>Contact:</strong> johndoe@email.com</p>
            <p><strong>Reason:</strong> Need academic counseling</p>
            <p><strong>Date:</strong> 2025-03-20</p>
            <p><strong>Time:</strong> 10:00 AM</p>
            <div class="buttons">
                <button class="approve" onclick="approveAppointment('John Doe', '2025-03-20', '10:00 AM')">Approve</button>
                <button class="decline" onclick="declineAppointment('John Doe')">Decline</button>
            </div>
        </div>
    </div>
</body>
</html>
