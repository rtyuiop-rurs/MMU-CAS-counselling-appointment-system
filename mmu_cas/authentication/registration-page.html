<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MMU Counselling Appointment</title>
    <link rel="stylesheet" href="registration.css"> <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="register-container">
        <img src="https://logowik.com/content/uploads/images/mmu-multimedia-university6129.jpg" alt="MMU Logo">
        <h1>MMU Counselling Appointment</h1>
        <h2>Register</h2>
        <form id="registerForm">
            <input id="fullName" type="text" placeholder="Full Name" required />
            <input id="email" type="email" placeholder="Email Address (e.g., ...@student.mmu.edu.my for students)" required />
            <input id="username" type="text" placeholder="Choose a Username" required />
            <input id="password" type="password" placeholder="Choose a Password" required />
            <input id="idNumber" type="text" placeholder="Student ID or Lecturer ID" required />
            <button type="submit">Register</button>
        </form>
        <p class="success-message" id="successMessage" style="display: none;">Successfully Registered!</p>
        <p class="error-message" id="errorMessage"></p>
        <a href="login-page.html">Already have an account? Login</a>
    </div>

    <button class="clear-button" id="clearFieldsButton">Clear All</button>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCugT4PA8Krc2kSUSZLjEE-TVJRyVKOxAE", 
            authDomain: "mmu-cas.firebaseapp.com",
            projectId: "mmu-cas",
            storageBucket: "mmu-cas.appspot.com",
            messagingSenderId: "814309169546",
            appId: "1:814309169546:web:dc514a74b6d07675145073",
            measurementId: "G-YHFGZ85W8H"
        };

        // Initialize Firebase
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const registerForm = document.getElementById("registerForm");
        const successMessage = document.getElementById("successMessage");
        const errorMessageDisplay = document.getElementById("errorMessage");
        const clearFieldsButton = document.getElementById("clearFieldsButton");
        const emailInput = document.getElementById("email");

registerForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    errorMessageDisplay.textContent = "";
    successMessage.style.display = "none";

    const fullName = document.getElementById("fullName").value.trim();
    const email = emailInput.value.trim(); // Make sure emailInput is defined
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const idNumber = document.getElementById("idNumber").value.trim();
    let student = "";

// const isStudentEmailFormat = email.toLowerCase().includes("@student.");
// if (isStudentEmailFormat) {
//     determinedRole = "student";
// } else {
//     determinedRole = "counselor";
// }

// For testing, assign a role directly. 
student = "student"; // Or "counselor"
console.warn("WARNING: MMU-specific email check is temporarily bypassed for testing. Role forced to:", student);

    try {
        // 1. Create auth user
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user; // Get the user object
        console.log("Firebase Auth user created:", user.uid);

        // 2. Send Verification Email
        try {
            await user.sendEmailVerification();
            console.log("Verification email sent to:", user.email);
        } catch (verificationError) {
            console.error("Error sending verification email:", verificationError);
            alert("Registration successful, but failed to send verification email. Please try logging in to resend.");
        }
        
        // 3. Create user document in Firestore
        await db.collection("users").doc(user.uid).set({
            fullName,
            email, 
            username,
            role: student,
            idNumber,
            emailVerified: true, // Initialize as true
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        console.log("User document created in Firestore for UID:", user.uid);

        successMessage.textContent = `Successfully Registered as a ${student}! A verification email has been sent to ${user.email}. Please check your inbox (and spam folder) and verify your email before logging in.`;
        successMessage.style.display = "block";
        registerForm.reset();

        // 4. Sign out the user immediately after registration
        // This forces them to log in (and be checked for verification) after verifying.
        await auth.signOut();
        console.log("User signed out after registration, pending verification.");

        // Redirect to login page after a delay, or just let them see the message.
        // setTimeout(() => {
        //     window.location.href = "login-page.html";
        // }, 5000); // Give time to read the message

    } catch (error) {
        console.error("Registration error:", error);
        // Ensure getRegisterErrorMessage handles 'auth/email-already-in-use', etc.
        errorMessageDisplay.textContent = getRegisterErrorMessage(error.code || error.message); 
        successMessage.style.display = "none";
    }
});

// Ensure getRegisterErrorMessage function is defined as you have it
function getRegisterErrorMessage(code) {
    switch (code) {
        case 'auth/email-already-in-use':
            return "This email address is already registered.";
        case 'auth/invalid-email':
            return "The email address is not valid.";
        case 'auth/weak-password':
            return "Password should be at least 6 characters long.";
        default:
            return `Registration failed: ${code}. Please try again.`;
    }
}

// const clearFieldsButton = document.getElementById("clearFieldsButton");
// clearFieldsButton.addEventListener("click", function() { ... }); // Your existing clear log

    </script>
</body>
</html>
