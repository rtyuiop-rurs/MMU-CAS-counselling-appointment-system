<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>MMU Counselling Appointment System</title>
</head>
<body>
    <div class="loginF">
        <img src="/images/OPSE_logo.png" alt="Logo" style="width: 100px; margin-bottom: 20px;" class="logo">
        <form>
            <label for="ID">Enter your ID number:</label>
            <input type="text" id="ID" placeholder="MMU ID" required>
            
            <label for="Email">Enter your MMU Email:</label>
            <input type="email" id="Email" placeholder="example@mmu.edu.my" required>
            
            <label for="Password">Enter your Password:</label>
            <input type="password" id="Password" placeholder="Your Password" required>
            
            <button type="submit" class="loginB">Login</button>
        </form>
    </div>
</body>
</html>
