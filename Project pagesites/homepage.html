<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="homepage.css">
    <title>Student Homepage</title>
</head>

<body>
    <div class="container">
        <h2>Student CAS Homepage</h2>
        
        <div class="notice">
            <h3>Important Notice</h3>
            <p><strong>Keep Your IDM Password Fresh!</strong></p>
            <p>Activate your IDM to avoid disruptions in accessing applications.</p>
        </div>

        <div class="grid">
            <div class="card">
                <img src="icon.png" alt="Personal Information"><br>
                Personal Information
            </div>
        </div>

        <div class="portal-container">
            <a href="calendar.html" class="square-icon">
                <img src="https://img.icons8.com/?size=100&id=23&format=png&color=000000" alt="Calendar Icon">
                <div class="icon-text">Check planned meetings and events</div>
            </a>
            <a href="plan.html" class="square-icon">
                <img src="https://img.icons8.com/?size=100&id=10034&format=png&color=000000" alt="Clock Icon">
                <div class="icon-text">Discuss with counsellor and pick time and date for meeting</div>
            </a>
            <a href="plan.html" class="square-icon">
                <img src="https://img.icons8.com/?size=100&id=O2jILzM6obXx&format=png&color=000000" alt="Message Icon">
                <div class="icon-text">Check out forums for guidance</div>
            </a>
        </div>
    </div>
</body>
</html>
