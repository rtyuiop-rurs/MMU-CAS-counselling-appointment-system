<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage Example</title>
</head>
<body>

    <h2>LocalStorage Meeting Example</h2>
    
    <div>
        <h3>Create Meeting</h3>
        <label for="student">Student:</label>
        <input type="text" id="student"><br>
        <label for="counselor">Counselor:</label>
        <input type="text" id="counselor"><br>
        <label for="date">Date:</label>
        <input type="date" id="date"><br>
        <label for="time">Time:</label>
        <input type="time" id="time"><br>
        <button onclick="createMeeting()">Create Meeting</button>
    </div>

    <button onclick="renderMeetings()">Show Meetings</button>

    <div id="meetingsList"></div>

    <div id="editForm" style="display:none;">
        <h3>Edit Meeting</h3>
        <input type="hidden" id="editId">
        <label for="editStudent">Student:</label>
        <input type="text" id="editStudent"><br>
        <label for="editCounselor">Counselor:</label>
        <input type="text" id="editCounselor"><br>
        <label for="editDate">Date:</label>
        <input type="date" id="editDate"><br>
        <label for="editTime">Time:</label>
        <input type="time" id="editTime"><br>
        <button onclick="updateMeeting()">Update Meeting</button>
    </div>

    <script>
        function createMeeting() {
            let studentName = document.getElementById("student").value;
            let counselorName = document.getElementById("counselor").value;
            let date = document.getElementById("date").value;
            let time = document.getElementById("time").value;
            saveMeeting(studentName, counselorName, date, time);
        }

        function saveMeeting(studentName, counselorName, date, time) {
            let meetings = JSON.parse(localStorage.getItem("meetings")) || [];
            let newMeeting = {
                id: Date.now(),
                student: studentName,
                counselor: counselorName,
                date: date,
                time: time,
                status: "pending"
            };
            meetings.push(newMeeting);
            localStorage.setItem("meetings", JSON.stringify(meetings));
            console.log("Meeting saved!");
            renderMeetings();
        }

        function getMeetings() {
            return JSON.parse(localStorage.getItem("meetings")) || [];
        }

        function deleteMeeting(id) {
            let meetings = getMeetings();
            meetings = meetings.filter(meeting => meeting.id !== id);
            localStorage.setItem("meetings", JSON.stringify(meetings));
            renderMeetings();
        }

        function editMeeting(id) {
            let meetings = getMeetings();
            let meeting = meetings.find(meeting => meeting.id === id);
            if (meeting) {
                document.getElementById("editId").value = meeting.id;
                document.getElementById("editStudent").value = meeting.student;
                document.getElementById("editCounselor").value = meeting.counselor;
                document.getElementById("editDate").value = meeting.date;
                document.getElementById("editTime").value = meeting.time;
                document.getElementById("editForm").style.display = "block";
            }
        }

        function updateMeeting() {
            let id = document.getElementById("editId").value;
            let student = document.getElementById("editStudent").value;
            let counselor = document.getElementById("editCounselor").value;
            let date = document.getElementById("editDate").value;
            let time = document.getElementById("editTime").value;

            let meetings = getMeetings();
            let meetingIndex = meetings.findIndex(meeting => meeting.id == id);
            if (meetingIndex !== -1) {
                meetings[meetingIndex].student = student;
                meetings[meetingIndex].counselor = counselor;
                meetings[meetingIndex].date = date;
                meetings[meetingIndex].time = time;
                localStorage.setItem("meetings", JSON.stringify(meetings));
                renderMeetings();
                document.getElementById("editForm").style.display = "none";
            }
        }

        function renderMeetings() {
            let meetings = getMeetings();
            let meetingsList = document.getElementById("meetingsList");
            meetingsList.innerHTML = "";
            meetings.forEach(meeting => {
                let meetingItem = document.createElement("div");
                meetingItem.textContent = `Student: ${meeting.student}, Counselor: ${meeting.counselor}, Date: ${meeting.date}, Time: ${meeting.time}, Status: ${meeting.status}`;
                
                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.onclick = () => deleteMeeting(meeting.id);
                
                let editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.onclick = () => editMeeting(meeting.id);
                
                meetingItem.appendChild(deleteButton);
                meetingItem.appendChild(editButton);
                meetingsList.appendChild(meetingItem);
            });
        }

        renderMeetings();
    </script>

</body>
</html>
