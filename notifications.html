<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        body {
            background-color: #002f6c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        .container {
            background-color: white;
            width: 800px;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: black;
        }
        .btn {
            background-color: black;
            color: white;
            width: 95%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #444;
        }
        .switch-btn {
            background-color: #ccc;
            color: black;
            margin-top: 20px;
        }
        .notification-box {
            background-color: #e0e0e0;
            padding: 10px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            margin: 8px 0;
            justify-content: space-between;
        }
        .notification-icon {
            width: 40px;
            height: 40px;
            background-color: gray;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            margin-right: 10px;
        }
        .notification-content {
            flex-grow: 1;
            text-align: left;
        }
        .notification-title {
            font-weight: bold;
            font-size: 16px;
        }
        .notification-description {
            font-size: 14px;
            color: #555;
        }
        .notification-time {
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>
