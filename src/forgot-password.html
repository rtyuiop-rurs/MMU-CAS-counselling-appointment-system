<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MMU Counselling</title>
    <!-- You can link your existing login-page.css or a new CSS file -->
    <link rel="stylesheet" href="login-page.css"> 
    <style>
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error-message { /* Already in your login-page.css, but ensure it's styled */
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .login-container a.back-to-login { /* Specific styling for back link */
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .login-container a.back-to-login:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Firebase SDKs - These MUST be loaded first -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <!-- No need for firestore.js on this page typically -->

    <script>
        // Your Firebase configuration object
        const firebaseConfig = {
            apiKey: "AIzaSyCugT4PA8Krc2kSUSZLjEE-TVJRyVKOxAE", // Your actual API key
            authDomain: "mmu-cas.firebaseapp.com",
            projectId: "mmu-cas",
            storageBucket: "mmu-cas.appspot.com",
            messagingSenderId: "814309169546",
            appId: "1:814309169546:web:dc514a74b6d07675145073",
            measurementId: "G-YHFGZ85W8H"
        };

        // Initialize Firebase
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                console.log("Firebase initialized on forgot-password.html");
            }
        } catch (e) {
            console.error("FATAL: Error initializing Firebase:", e);
            // Display critical error if Firebase can't initialize
            // document.body.innerHTML = "<h1>Critical Firebase Initialization Error.</h1>";
        }
    </script>
</head>
<body>
    <div class="login-container">
        <img src="https://logowik.com/content/uploads/images/mmu-multimedia-university6129.jpg" alt="MMU Logo">
        <h1>MMU Counselling Appointment</h1>
        <h2>Forgot Password</h2>
        <p style="text-align: center; margin-bottom: 20px; font-size: 0.9em; color: #555;">
            Enter your email address and we'll send you a link to reset your password.
        </p>
        <form id="forgotPasswordForm">
            <input id="email" type="email" placeholder="Enter Your Registered Email" required />
            <button type="submit" id="resetPasswordBtn">Send Reset Link</button>
        </form>
        <div id="messageDisplay" class="message" style="display: none;"></div>
        <a href="login-page.html" class="back-to-login">Back to Login</a>
    </div>

    <script>
        let authService;
        if (typeof firebase !== 'undefined' && firebase.auth) {
            try {
                authService = firebase.auth();
                console.log("Forgot Password Script: Firebase auth service accessed.");
            } catch (e) {
                console.error("Forgot Password Script: Error accessing Firebase auth service:", e);
                const messageDisplay = document.getElementById("messageDisplay");
                if (messageDisplay) {
                    messageDisplay.textContent = "Error initializing authentication service. Please try again later.";
                    messageDisplay.className = 'message error-message';
                    messageDisplay.style.display = 'block';
                }
                const form = document.getElementById("forgotPasswordForm");
                if(form) form.style.display = 'none'; // Hide form if auth fails
            }
        } else {
            console.error("Forgot Password Script FATAL: Firebase SDK not loaded or auth service missing.");
            const messageDisplay = document.getElementById("messageDisplay");
            if (messageDisplay) {
                messageDisplay.textContent = "Critical error: Firebase library not loaded. Cannot proceed.";
                messageDisplay.className = 'message error-message';
                messageDisplay.style.display = 'block';
            }
             const form = document.getElementById("forgotPasswordForm");
             if(form) form.style.display = 'none';
        }

        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const messageDisplay = document.getElementById('messageDisplay');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');

        if (forgotPasswordForm && emailInput && messageDisplay && resetPasswordBtn && authService) {
            forgotPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();

                if (!email) {
                    messageDisplay.textContent = 'Please enter your email address.';
                    messageDisplay.className = 'message error-message';
                    messageDisplay.style.display = 'block';
                    return;
                }

                resetPasswordBtn.disabled = true;
                resetPasswordBtn.textContent = 'Sending...';
                messageDisplay.style.display = 'none';
                messageDisplay.textContent = '';


                try {
                    await authService.sendPasswordResetEmail(email);
                    messageDisplay.textContent = 'Password reset email sent! Please check your inbox (and spam folder) for a link to reset your password.';
                    messageDisplay.className = 'message success-message';
                    emailInput.value = ''; // Clear the input field
                } catch (error) {
                    console.error('Error sending password reset email:', error);
                    let friendlyMessage = "Failed to send password reset email. Please check the email address and try again.";
                    if (error.code === 'auth/user-not-found') {
                        friendlyMessage = "No account found with that email address. Please check the email or register for a new account.";
                    } else if (error.code === 'auth/invalid-email') {
                        friendlyMessage = "The email address format is invalid.";
                    }
                    messageDisplay.textContent = friendlyMessage;
                    messageDisplay.className = 'message error-message';
                } finally {
                    messageDisplay.style.display = 'block';
                    resetPasswordBtn.disabled = false;
                    resetPasswordBtn.textContent = 'Send Reset Link';
                }
            });
        } else {
            if (messageDisplay && !authService && typeof firebase !== 'undefined') {
                 // This case should be caught by earlier check, but as a fallback.
                messageDisplay.textContent = "Password reset service is currently unavailable.";
                messageDisplay.className = 'message error-message';
                messageDisplay.style.display = 'block';
            } else if (!forgotPasswordForm || !emailInput || !messageDisplay || !resetPasswordBtn) {
                console.error("One or more essential HTML elements for forgot password form are missing.");
                 if(messageDisplay){
                    messageDisplay.textContent = "Page error. Please refresh.";
                    messageDisplay.className = 'message error-message';
                    messageDisplay.style.display = 'block';
                 }
            }
        }
    </script>
</body>
</html>
