<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselor CAS Homepage</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        /* Styling for Name and ID only */
        .student-info .card:first-child p {
            font-size: 15px; /* Larger text size */
            font-weight: bold; /* Bold text */
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Counselor CAS Homepage</h1>
        </header>
        <section class="notice">
            <h2>Important Notice</h2>
            <p><strong>Update Your Availability!</strong><br>If you find an error saying email not verified, please refresh the page.</p>
        </section>
        <section class="student-info"> <div class="card">
                <p><strong>Name:</strong> <span id="counselorName"></span></p>
                <p><strong>ID:</strong> <span id="counselorId"></span></p>
            </div>
            <div class="card notification-preview">
                <h3>Latest Notifications</h3>
                <div id="notificationPreviewList"></div>
                <a href="notification.html" class="see-all-link">View all notifications &rarr;</a>
            </div>
        </section>
        <section class="action-grid">
            <div class="action-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Google_Calendar_icon_%282020%29.svg" alt="Schedule Icon">
                <p><a href="counselor-meetings.html">View and manage appointment schedule</a></p>
            </div>
            <div class="action-card">
                <img src="https://www.svgrepo.com/show/326193/forum.svg" alt="Froum Icon">
                <p><a href="forum4.html">View forums and response to students</a></p>
            </div>
        </section>
        <footer>
            <button id="logoutButton">Logout</button>
        </footer>
    </div>


<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCugT4PA8Krc2kSUSZLjEE-TVJRyVKOxAE", // Keep your actual API key
        authDomain: "mmu-cas.firebaseapp.com",
        projectId: "mmu-cas",
        storageBucket: "mmu-cas.appspot.com",
        messagingSenderId: "814309169546",
        appId: "1:814309169546:web:dc514a74b6d07675145073",
        measurementId: "G-YHFGZ85W8H"
    };

    // Initialize Firebase (if not already initialized)
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Logout handler
    const logoutButton = document.getElementById("logoutButton");
    // console.log("Counselor Page: Logout button element:", logoutButton); // For debugging

    if (logoutButton) {
        logoutButton.addEventListener("click", () => {
            // console.log("Counselor Page: Logout button clicked!"); // For debugging
            // console.log("Counselor Page: Auth object at time of logout click:", auth); // For debugging

            if (auth) {
                auth.signOut().then(() => {
                    console.log("Counselor sign-out successful");
                    sessionStorage.removeItem("currentUser"); // Clear session data
                    window.location.href = "login-page.html"; // Redirect to login
                }).catch((error) => {
                    console.error("Counselor sign-out error:", error);
                    alert("Error signing out: " + error.message);
                });
            } else {
                console.error("Counselor Page: Auth object is NOT available for logout.");
                alert("An error occurred (auth not available). Please try refreshing.");
            }
        });
    } else {
        console.error("Counselor Page: Logout button not found in the DOM.");
    }

    // Auth state listener for page protection and displaying user info
    auth.onAuthStateChanged(async (user) => {
        if (user) { // User is signed in according to Firebase
            let userDataFromSession = JSON.parse(sessionStorage.getItem("currentUser"));
            // console.log("Counselor Page: currentUser from sessionStorage:", userDataFromSession); // For debugging

            if (userDataFromSession && userDataFromSession.uid === user.uid) {
                // User data from session storage matches the authenticated Firebase user
                if (userDataFromSession.role === "counselor") {
                    // console.log("Counselor Page: Role confirmed as counselor."); // For debugging

                    // Fetch fresh data from Firestore to display
                    const userDocRef = db.collection("users").doc(user.uid);
                    const userDoc = await userDocRef.get();

                    if (userDoc.exists) {
                        const freshUserData = userDoc.data();
                        // console.log("Counselor Page: Fresh data from Firestore:", freshUserData); // For debugging

                        // Display counselor's information - adapt field names if different for counselors in Firestore
                        document.getElementById("counselorName").textContent = freshUserData.fullName || "N/A";
                        document.getElementById("counselorId").textContent = freshUserData.idNumber || "N/A"; // Assuming 'idNumber' is also used for counselors (e.g., Lecturer ID)

                        // Update sessionStorage with the latest fresh data
                        sessionStorage.setItem("currentUser", JSON.stringify({
                            uid: user.uid,
                            email: freshUserData.email,
                            fullName: freshUserData.fullName,
                            username: freshUserData.username,
                            role: freshUserData.role,
                            idNumber: freshUserData.idNumber
                        }));
                    } else {
                        console.error("Counselor Page: User document not found in Firestore. UID:", user.uid);
                        alert("Your user data could not be found. Logging out.");
                        if (auth.currentUser) await auth.signOut(); else window.location.href = "login-page.html";
                    }
                } else {
                    // User is logged in, but their role is not 'counselor'
                    alert("Access Denied. You do not have counselor privileges.");
                    if (auth.currentUser) await auth.signOut(); else window.location.href = "login-page.html";
                }
            } else {
                // Session storage data is missing, or doesn't match the Firebase user
                console.warn("Counselor Page: Session storage data inconsistent. Redirecting to login.");
                alert("Your session is invalid or has expired. Please login again.");
                if (auth.currentUser) await auth.signOut(); else window.location.href = "login-page.html";
            }
        } else {
            // No user is signed in according to Firebase
            // console.log("Counselor Page: No Firebase user. Redirecting to login."); // For debugging
            // alert("Please login to access the counselor dashboard."); // Can be a bit intrusive if it shows on every redirect
            sessionStorage.removeItem("currentUser"); // Ensure session is cleared
            window.location.href = "login-page.html";
        }
    });
</script>
</body>
</html>
