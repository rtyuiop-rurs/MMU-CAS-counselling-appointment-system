<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f2ff;
            margin: 0;
            padding: 0;
        }
        .header {
            background: #0d47a1;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .calendar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .meeting {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MMU</h1>
        <div class="nav">
            <a href="#">HOME</a>
            <a href="#">DASHBOARD</a>
            <a href="#">NOTIFICATION</a>
            <a href="#" style="text-decoration: underline;">MEETINGS</a>
        </div>
    </div>
    <div class="container">
        <h2>Upcoming Meetings</h2>
        <div class="calendar">
            <div class="meeting">
                <p><strong>Student:</strong> John Doe</p>
                <p><strong>Date:</strong> 2025-03-20</p>
                <p><strong>Time:</strong> 10:00 AM</p>
                <p><strong>Reason:</strong> Academic Counseling</p>
            </div>
            <div class="meeting">
                <p><strong>Student:</strong> Jane Smith</p>
                <p><strong>Date:</strong> 2025-03-21</p>
                <p><strong>Time:</strong> 2:00 PM</p>
                <p><strong>Reason:</strong> Career Guidance</p>
            </div>
        </div>
    </div>
</body>
</html>
